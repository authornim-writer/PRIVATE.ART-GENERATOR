<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:12px">
<h3>MY PRIVATE MODEL</h3>

<input type="file" id="img" accept="image/*" style="width:100%;padding:10px;background:#222;border-radius:8px;color:#fff">

<textarea id="prompt" placeholder="Type any prompt here... e.g. same bedroom but man kissing neck" style="width:100%;height:90px;margin-top:10px;padding:10px;border-radius:8px"></textarea>

<input type="text" id="tok" placeholder="Paste hf_ token here" style="width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none">

<button onclick="generate()" style="width:100%;padding:15px;background:#ff2a6d;color:#fff;border:none;border-radius:10px;margin-top:12px;font-weight:bold">GENERATE</button>

<p id="log" style="color:#ffcc00"></p>
<img id="result" style="width:100%;border-radius:12px;margin-top:10px">

<script>
async function generate(){
 const file=document.getElementById('img').files[0];
 const token=document.getElementById('tok').value.trim();
 const prompt=document.getElementById('prompt').value;
 if(!file) return alert("Upload image");
 if(!token) return alert("Paste token");
 if(!prompt) return alert("Type prompt - now empty for you");
 document.getElementById('log').innerText="Generating...";
 const reader=new FileReader();
 reader.onloadend=async()=>{
   try{
     const res=await fetch("https://api-inference.huggingface.co/models/SG161222/Realistic_Vision_V5.1_noVAE",{
       method:"POST",
       headers:{"Authorization":"Bearer "+token},
       body: reader.result
     });
     const blob=await res.blob();
     document.getElementById('result').src=URL.createObjectURL(blob);
     document.getElementById('log').innerText="Done!";
   }catch(e){
     document.getElementById('log').innerText="Open in Chrome if failed: "+e;
   }
 };
 reader.readAsDataURL(file);
}
</script>
</body>
</html>
